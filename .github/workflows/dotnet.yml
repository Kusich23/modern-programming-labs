name: .NET CI

on:
  push:
    branches:
      - main
      - "lab/*"
      - "project/*"
      - "feature/*"
  pull_request:
    branches:
      - main
      - "lab/*"
      - "project/*"
      - "feature/*"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ModernProgramming.slnx

      - name: Build solution
        run: dotnet build ModernProgramming.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test ModernProgramming.slnx --configuration Release --no-build
